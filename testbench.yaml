laravel: '@testbench'

providers:
  # Lets Larastan, which boots Testbench outside its CLI, see the package's views.
  - TacticalNinj4\DbExplorer\DbExplorerServiceProvider
  - Workbench\App\Providers\WorkbenchServiceProvider

migrations:
  - workbench/database/migrations

seeders:
  - Workbench\Database\Seeders\DatabaseSeeder

workbench:
  start: '/'
  install: true
  health: false
  discovers:
    web: true
    api: true
    commands: true
    components: false
    factories: true
    views: false
  build:
    - asset-publish
    - create-sqlite-db
    # Postgres roles and database when DB_PGSQL_HOST is set (docs/TESTING.md §3.1).
    - workbench-pgsql
    - db-wipe
    - migrate-fresh
  assets:
    - laravel-assets
  sync:
    - from: storage
      to: workbench/storage
      reverse: true
